name: Build Boot Client image

# Builds the prebuilt Boot Client boot image -- a kernel + an initramfs
# that boots straight into autodeploy-boot -- so operators never have to
# build it (or install a toolchain) themselves.
#
# NOTE: the actual RELEASE attachment of the kernel + initrd happens in
# release.yml's `bootimage` job, NOT here. A `release: published` trigger
# would never fire for our releases, because they're published by
# GITHUB_TOKEN (via auto-tag.yml's `gh workflow run`), and GitHub
# suppresses workflow runs triggered by GITHUB_TOKEN events. This file is
# kept ONLY for `workflow_dispatch` -- a manual, on-demand build that
# produces the kernel + initrd as a downloadable workflow artifact (handy
# for testing a boot-image change without cutting a release).
#
# Outputs (as a `bootimage` workflow artifact):
#   - autodeploy-kernel        Linux kernel (Ubuntu generic: broad NIC +
#                              disk coverage incl. Hyper-V hv_netvsc /
#                              hv_storvsc and virtio)
#   - autodeploy-initrd        initramfs bundling autodeploy-boot, the
#                              imaging tools, and the kernel's modules
#                              (loaded by init at boot)
#   - autodeploy-shim.efi      Microsoft-signed Ubuntu shim; iPXE's `shim`
#                              command verifies the Canonical-signed kernel
#                              through it under UEFI Secure Boot
#   - <name>.sha256            sha256 sidecar per file
#
# x86_64 only for now: the overwhelming majority of imaging targets are
# UEFI/BIOS x64. arm64 targets would need an arm64 kernel + initrd built
# on an arm runner; out of scope here.

on:
  workflow_dispatch: {}

permissions:
  contents: write    # to attach the artifacts to the release

jobs:
  build:
    name: Build kernel + initramfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: boot-client/go.sum

      - name: Install build toolchain + kernel
        run: |
          sudo apt-get update
          # linux-image-generic: a kernel whose modules cover Hyper-V,
          #   virtio, and common bare-metal NIC/disk controllers. We bundle
          #   its /lib/modules tree into the initramfs and ship its vmlinuz.
          # kmod:                modprobe/depmod for the initramfs.
          # busybox-static:      sh + coreutils inside the initramfs.
          # gdisk/dosfstools:    sgdisk + mkfs.fat (single FAT32 boot part).
          # efibootmgr:          register the staged partition with firmware.
          # unzip:               expand driver packages onto the media.
          # ethtool:             disable USB-NIC hardware offloads at boot
          #   (the r8152/RTL8153 large-transfer stall workaround).
          # cpio/gzip:           pack the initramfs.
          # shim-signed: Microsoft-signed Ubuntu shim, shipped as
          #   autodeploy-shim.efi for UEFI Secure Boot (iPXE `shim` command
          #   verifies the Canonical-signed kernel through it).
          sudo apt-get install -y \
              linux-image-generic \
              shim-signed \
              kmod busybox-static cpio gzip \
              gdisk dosfstools efibootmgr unzip ethtool

      - name: Resolve kernel version
        id: kver
        run: |
          # Pick the newest installed generic kernel.
          vmlinuz=$(ls -1 /boot/vmlinuz-*-generic | sort -V | tail -1)
          kver=$(basename "$vmlinuz" | sed 's/^vmlinuz-//')
          echo "Selected kernel: $kver ($vmlinuz)"
          echo "kver=$kver" >> "$GITHUB_OUTPUT"
          echo "vmlinuz=$vmlinuz" >> "$GITHUB_OUTPUT"

      - name: Build initramfs
        env:
          KERNEL_VERSION: ${{ steps.kver.outputs.kver }}
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          mkdir -p out
          scripts/initramfs/build-initramfs.sh
          ls -la out/

      - name: Stage release artifacts
        id: stage
        run: |
          mkdir -p bootimage
          # Kernel may be mode 0600 in /boot; sudo to copy then fix perms.
          sudo cp "${{ steps.kver.outputs.vmlinuz }}" bootimage/autodeploy-kernel
          sudo chown "$USER" bootimage/autodeploy-kernel
          chmod 0644 bootimage/autodeploy-kernel
          cp out/initrd.img bootimage/autodeploy-initrd
          # Microsoft-signed Ubuntu shim for Secure Boot (prefer .latest).
          shim_src=$(ls -1 /usr/lib/shim/shimx64.efi.signed.latest \
                            /usr/lib/shim/shimx64.efi.signed 2>/dev/null | head -1)
          if [ -n "$shim_src" ]; then
              cp "$shim_src" bootimage/autodeploy-shim.efi
              echo "Staged signed shim from $shim_src"
          else
              echo "::warning::shim-signed not found; autodeploy-shim.efi omitted"
          fi
          cd bootimage
          for f in autodeploy-kernel autodeploy-initrd autodeploy-shim.efi; do
              [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          echo "Kernel:  $(stat -c%s autodeploy-kernel) bytes"
          echo "Initrd:  $(stat -c%s autodeploy-initrd) bytes"
          ls -la

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootimage
          path: bootimage/*
          if-no-files-found: error
