name: Release

# Build cross-platform artifacts and attach them to a GitHub Release.
#
# Triggers:
#   - A pushed tag matching v*  → build and create a release with the tag's name
#   - A manual workflow_dispatch → build the artifacts but skip the release
#
# Each binary is built reproducibly (CGO_ENABLED=0, -trimpath, ldflags
# stripping the symbol table) and uploaded both as a workflow artifact
# (for the manual-dispatch path) and as a release asset.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # required to create / update the GitHub Release

jobs:
  build:
    name: Build ${{ matrix.component }} ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Server: Linux amd64/arm64, Windows amd64, macOS amd64/arm64.
          - { component: server,      goos: linux,   goarch: amd64, suffix: "" }
          - { component: server,      goos: linux,   goarch: arm64, suffix: "" }
          - { component: server,      goos: windows, goarch: amd64, suffix: ".exe" }
          - { component: server,      goos: darwin,  goarch: amd64, suffix: "" }
          - { component: server,      goos: darwin,  goarch: arm64, suffix: "" }
          # Boot Client: Linux only (it runs in the initramfs).
          - { component: boot-client, goos: linux,   goarch: amd64, suffix: "" }
          - { component: boot-client, goos: linux,   goarch: arm64, suffix: "" }
          # Agent: Windows (primary target) + Linux for dev hosts.
          - { component: agent,       goos: windows, goarch: amd64, suffix: ".exe" }
          - { component: agent,       goos: windows, goarch: arm64, suffix: ".exe" }
          - { component: agent,       goos: linux,   goarch: amd64, suffix: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: ${{ matrix.component }}/go.sum
      - name: Build
        working-directory: ${{ matrix.component }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Binary names match the cmd/ entrypoints.
          case "${{ matrix.component }}" in
            server)      bin=autodeploy-server ;;
            boot-client) bin=autodeploy-boot ;;
            agent)       bin=autodeploy-agent ;;
          esac
          # Strip the refs/tags/ prefix when the trigger was a tag
          # push; manual workflow_dispatch falls back to "dev" so the
          # version is never an empty string.
          version="${GITHUB_REF#refs/tags/}"
          if [ "$version" = "$GITHUB_REF" ]; then version=dev; fi
          out="bin/${bin}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          mkdir -p bin
          go build -trimpath \
              -ldflags="-s -w -X main.Version=${version}" \
              -o "$out" "./cmd/${bin}"
          ls -la "$out"
          # SHA-256 alongside the binary so operators can verify
          # downloads. The .version sidecar lets the server (and the
          # operator-facing install scripts) discover the bundled
          # version without running the binary.
          sha256sum "$out" > "$out.sha256"
          echo "$version" > "$out.version"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ matrix.component }}/bin/*
          if-no-files-found: error

  # Bundle the initramfs build script + an example boot.ipxe and the
  # operator-facing scripts so a downloaded release is self-contained.
  package-extras:
    name: Package operator scripts and configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage extras
        run: |
          mkdir -p out
          tar -czf out/autodeploy-extras.tar.gz \
            scripts/install-linux.sh \
            scripts/initramfs/ \
            scripts/fetch-ipxe.sh \
            scripts/backup.sh \
            scripts/check-secrets.sh \
            scripts/systemd/ \
            scripts/windows/ \
            docs/user-guide/ \
            README.md
          sha256sum out/autodeploy-extras.tar.gz > out/autodeploy-extras.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: extras
          path: out/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, package-extras]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          mkdir -p release
          # Flatten the per-matrix subdirectories into a single
          # release/ directory.
          find artifacts -type f \( -name 'autodeploy-*' -o -name '*.tar.gz' -o -name '*.sha256' -o -name '*.version' \) \
            -exec cp -a '{}' release/ \;
          ls -la release/
      - name: Generate release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          {
            echo "## AutoDeploy ${tag}"
            echo
            echo "### Quick start (Linux server)"
            echo
            echo '```sh'
            echo "TAG=${tag}"
            echo 'URL=https://github.com/Rusketh/AutoDeploy/releases/download/$TAG'
            echo 'curl -LO $URL/autodeploy-server-linux-amd64'
            echo 'curl -LO $URL/autodeploy-extras.tar.gz'
            echo 'tar xzf autodeploy-extras.tar.gz'
            echo 'sudo ./scripts/install-linux.sh'
            echo 'sudo systemctl enable --now autodeploy'
            echo 'sudo cat /var/lib/autodeploy/admin-bootstrap.txt   # one-time password'
            echo '```'
            echo
            echo "### Quick start (Windows server)"
            echo
            echo '```powershell'
            echo "\$TAG = '${tag}'"
            echo '$URL = "https://github.com/Rusketh/AutoDeploy/releases/download/$TAG"'
            echo 'Invoke-WebRequest "$URL/autodeploy-server-windows-amd64.exe" -OutFile autodeploy-server-windows-amd64.exe'
            echo 'Invoke-WebRequest "$URL/autodeploy-extras.tar.gz"             -OutFile autodeploy-extras.tar.gz'
            echo 'tar -xzf autodeploy-extras.tar.gz'
            echo '# elevated PowerShell:'
            echo '.\scripts\windows\install-windows.ps1'
            echo 'Get-Content C:\ProgramData\AutoDeploy\admin-bootstrap.txt   # one-time password'
            echo '```'
            echo
            echo "Full tutorial: \`docs/user-guide/getting-started.md\` (Linux) and \`docs/user-guide/install-windows.md\` (Windows) inside \`autodeploy-extras.tar.gz\`."
            echo
            echo "### Downloads"
            echo
            echo "Verify each file with the matching \`.sha256\`."
            echo
            echo "**autodeploy-server** — management portal + JSON API + payload service + Domain Integration Service + (optional) TFTP."
            echo "Linux amd64/arm64, Windows amd64, macOS amd64/arm64."
            echo
            echo "**autodeploy-boot** — Linux Boot Client (Linux amd64/arm64). Goes into the initramfs."
            echo
            echo "**autodeploy-agent** — Deployment Client (Windows amd64/arm64, Linux amd64). Bundled into deployed Windows images via the unattend."
            echo
            echo "**autodeploy-extras.tar.gz** — operator helpers and docs:"
            echo "- \`scripts/install-linux.sh\` — one-shot Linux installer (binary, system user, systemd unit, iPXE)."
            echo "- \`scripts/initramfs/build-initramfs.sh\` — assemble the Boot Client initramfs."
            echo "- \`scripts/fetch-ipxe.sh\` — fetch iPXE bootstrap binaries (\`undionly.kpxe\`, \`ipxe.efi\`, …)."
            echo "- \`scripts/systemd/\` — production systemd unit and example env file."
            echo "- \`scripts/windows/\` — Windows installer + uninstaller + backup (PowerShell) and env-file template."
            echo "- \`scripts/backup.sh\` — consistent backup of the SQLite store, secrets key, TLS material."
            echo "- \`scripts/check-secrets.sh\` — CI tripwire for cleartext-secret patterns."
            echo "- \`docs/user-guide/\` — full operator guide for this release."
            echo "- \`README.md\` — repository orientation."
          } > release-notes.md
          cat release-notes.md
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/*
