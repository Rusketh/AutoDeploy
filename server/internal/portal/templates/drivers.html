{{define "body"}}
<h2>Driver packages</h2>
{{if .Items}}
<table>
  <thead><tr><th>ID</th><th>Name</th><th>Filters</th><th>Size</th></tr></thead>
  <tbody>
    {{range .Items}}
    <tr>
      <td>{{.ID}}</td>
      <td>{{.Name}}</td>
      <td>{{len .Filters}}</td>
      <td>{{.SizeBytes}}</td>
    </tr>
    {{end}}
  </tbody>
</table>
{{else}}
<p>No driver packages yet. Create one with <code>POST /api/v1/drivers</code>.</p>
{{end}}
{{end}}
