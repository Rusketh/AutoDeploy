{{define "body"}}
<div class="toolbar">
  <h2><svg class="icon-h2"><use href="#i-gear"/></svg>Operational settings</h2>
  <div class="right"><a class="btn ghost sm" href="/portal/settings"><svg><use href="#i-arrow-left"/></svg>Settings</a></div>
</div>

<form class="std" method="POST" action="/portal/settings/operational">
  <fieldset><legend>Log retention</legend>
    <label><span class="lbl">Keep log events for (days)</span>
      <input type="number" name="retention_days" value="{{.Data.RetentionDays}}" min="0" max="3650">
      <span class="hint">0 disables pruning — log_event grows forever. The retention scheduler ticks hourly and prunes rows older than the cutoff.</span>
    </label>
  </fieldset>
  <fieldset><legend>Display time zone</legend>
    <label><span class="lbl">Portal time zone</span>
      <input type="text" name="display_timezone" value="{{.Data.Timezone}}" list="tz-list" placeholder="UTC" autocomplete="off" spellcheck="false">
      <datalist id="tz-list">
        {{range .Data.CommonZones}}<option value="{{.}}">{{end}}
      </datalist>
      <span class="hint">
        IANA name (e.g. <code>Europe/London</code>, <code>America/New_York</code>) used to render dates and times — including each machine's last check-in — across the portal.
        Leave blank for <strong>UTC</strong>. Daylight saving is handled automatically. <strong>Applies immediately</strong> on save.
      </span>
    </label>
  </fieldset>
  <fieldset><legend>Agent check-in interval</legend>
    <label><span class="lbl">Resident agent poll interval (seconds)</span>
      <input type="number" name="agent_poll_seconds" value="{{.Data.CheckInSeconds}}" min="5" max="86400">
      <span class="hint">
        How often each deployed agent polls <code>/api/v1/agent/self</code> for pending jobs, re-image flags and software, and reports its name / AD location.
        The default is 300 (5 minutes). Lower it (e.g. 30) while testing so changes apply quickly; raise it for a large fleet. Minimum 5s.
        <strong>Each agent applies the new value on its next poll</strong> — so a change can take up to the current interval to take effect.
      </span>
    </label>
  </fieldset>
  <fieldset><legend>Payload throttle</legend>
    <label><span class="lbl">Maximum concurrent <code>/payload/*</code> streams</span>
      <input type="number" name="payload_max_in_flight" value="{{.Data.Throttle}}" min="0" max="65535">
      <span class="hint">
        Caps concurrent payload (WIM / driver / software) downloads so a thundering herd queues rather than thrashing file descriptors.
        0 = unlimited (don't pick this on production). The default is 128; raise for hosts with bigger fd budgets, lower if mirrors are absorbing most of the load.
        <strong>Takes effect on next server restart.</strong>
      </span>
    </label>
  </fieldset>
  <div class="actions">
    <a class="btn secondary" href="/portal/settings">Cancel</a>
    <button type="submit"><svg><use href="#i-check"/></svg>Save</button>
  </div>
</form>
{{end}}
