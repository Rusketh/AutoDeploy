{{define "body"}}
<div class="login">
  <h2>
    {{if .Brand.LogoDataURL}}<img src="{{.Brand.LogoDataURL}}" alt="logo" class="logo login-logo">{{end}}
    Sign in to {{.Brand.ProductName}}
  </h2>
  {{with .Data.Error}}
  <div class="flash flash-err flash-inline">
    <svg><use href="#i-alert"/></svg><span>{{.}}</span>
  </div>
  {{end}}
  <form method="POST" action="/portal/login">
    {{with .Data.Next}}<input type="hidden" name="next" value="{{.}}">{{end}}
    <label>Username<input type="text" name="username" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit"><svg><use href="#i-lock"/></svg>Sign in</button>
  </form>
</div>
{{end}}
